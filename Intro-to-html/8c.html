<!DOCTYPE html>
<html>
  <head>
    <style>
      .sea{
        width:600px;
        border:none;
        font-size:18px;
        margin-top:5px;
        border-radius:18px;
        padding-top:9px;
        padding-bottom:9px;
        padding-left:17px;
        margin-bottom:0px;
        box-shadow:1px 5px 19px rgba(0,0,0,0.5);
        margin:auto;
        display:block;
      }
      .image{
        width:200px;
        height:200px;
        object-fit:contain;
        margin:auto;
      }
      div{
        text-align:center;
      }
      button{
        margin-top:30px;
        border:none;
        margin-right:10px;
        padding-top:10px;
        padding-bottom:10px;
        padding-left:5px;
        padding-right:5px;
        border-radius:4px;
      }
    </style>
  </head>
  <body>
    <div>
      <img class="image" src="google.png">
    <input class="sea" placeholder="Search Google or type a URL">
      <button>
        Google Search
      </button>
      <button>
        I'm Feeling Lucky
      </button>
    </div>
    
  </body>
</html>
