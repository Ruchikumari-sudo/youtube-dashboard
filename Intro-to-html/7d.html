<!DOCTYPE html>
<html>
  <head>
    <style>
      .search{
        border-radius:4px;
        border:solid;
        border-width:1px;
        border-color:grey;
        padding:10px 15px;
        font-size:20px;
      }
      .google{
        margin-top:10px;
        width:400px;
        font-size:20px;
        border:none;
        box-shadow:0px 3px 10px rgba(0,0,0,0.5);
        border-radius:50px;
        padding:12px 10px;
      }
    </style>
  </head>
  <body>
    <input class="search" placeholder="Search">
    <input class="google" placeholder="Search Google or type a URL">
  </body>
</html>
