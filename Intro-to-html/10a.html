<!DOCTYPE html>
<html>
  <head>
    <style>
      p{
        margin-top:0px;
        margin-bottom:0px;
        font-family:Roboto,Arial;
      }
      .main{
        box-shadow:0px 10px 200px rgba(0,0,0,0.4);
        padding-left:15px;
        }
      .profile,.des,.but{
        display:inline-block;
        vertical-align:top;
      }
      .profile{
        width:40px;
        margin-top:45px;
        
      }
      .des{
        margin-left:10px;
        margin-right:100px;
        width:100px;
      }
      .prof{
        width:40px;
        border-radius:50px;
      }
      .name{
        font-weight:Bold;
        margin-top:30px;
        margin-bottom:5px;
        
      }
      .description{
        color:rgb(96,96,96);
        margin-bottom:3px;
      }
      .tag{
        color:rgb(133, 132, 132);
      
      }
      button{
        margin-top:40px;
        padding-top:5px;
        padding-bottom:5px;
        padding-left:9px;
        padding-right:9px;
        color:white;
        font-weight:bold;
        border:none;
        border-radius:3px;
        background-color:rgb(20, 157, 216);
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="profile">
        <img class="prof" src="../channels-pic/channel-6.jpeg">
      </div>
      <div class="des">
        <p class="name">
          oliver
        </p>
        <p class="description">
          the cat
        </p>
        <p class="tag">
          Popular
        </p>
      </div>
      <div class="but">
        <button>
          Follow
        </button>
      </div>
    </div>
    
    <div class="main">
      <div class="profile">
        <img class="prof" src="../channels-pic/channel-2.jpeg">
      </div>
      <div class="des">
        <p class="name">
          mimi
        </p>
        <p class="description">
          sleepy cat
        </p>
        <p class="tag">
          Popular
        </p>
      </div>
      <div class="but">
        <button>
          Follow
        </button>
      </div>
    </div>
    
    <div class="main">
      <div class="profile">
        <img class="prof" src="../channels-pic/channel-5.jpeg">
      </div>
      <div class="des">
        <p class="name">
          Rex
        </p>
        <p class="description">
          happy bulldog
        </p>
        <p class="tag">
          Popular
        </p>
      </div>
      <div class="but">
        <button>
          Follow
        </button>
      </div>
    </div>
    

  </body>
</html>
